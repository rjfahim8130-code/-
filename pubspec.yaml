name: calculator_vault
description: Age Calculator with private vault for stories, videos and local media.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  path: ^1.9.0
  image_picker: ^1.0.7
  video_player: ^2.8.2
  chewie: ^1.7.5
  intl: ^0.19.0
  uuid: ^4.3.3

dependency_overrides:
  package_info_plus: 8.0.2
  wakelock_plus: 1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    
